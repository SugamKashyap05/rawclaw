# SECURITY: Fluent Bit reads audit logs from a read-only mount and forwards
# them out of the app write path. State is kept on a separate writable volume.

[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/log/rawclaw/audit/*.log
    Tag               rawclaw.audit
    Refresh_Interval  5
    Rotate_Wait       30
    DB                /fluent-bit/state/flb_audit.db
    Read_from_Head    true

[FILTER]
    Name        record_modifier
    Match       rawclaw.audit
    Record      source rawclaw-agent
    Record      environment ${ENVIRONMENT}

[OUTPUT]
    Name        loki
    Match       rawclaw.audit
    Host        loki
    Port        3100
    Labels      job=rawclaw_audit,service=agent
    line_format json
