name: rawclaw DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  sast-python:
    name: SAST Python (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install scanners
        run: pip install bandit semgrep
      - name: Bandit scan
        run: |
          bandit -r apps/agent/src/ apps/swarm-worker/src/ \
            --severity-level medium \
            --format json \
            --output bandit-report.json
      - name: Semgrep Python
        run: |
          semgrep --config=p/python \
                  --config=p/owasp-top-ten \
                  --config=p/secrets \
                  --json \
                  --output semgrep-python-report.json \
                  apps/agent/src/ apps/swarm-worker/src/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-python-reports
          path: |
            bandit-report.json
            semgrep-python-report.json

  sast-typescript:
    name: SAST TypeScript (Semgrep + tsc)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - name: TypeScript compile check
        run: npx tsc -p apps/api/tsconfig.json --noEmit --incremental false
      - name: Semgrep TypeScript
        run: |
          pip install semgrep
          semgrep --config=p/typescript \
                  --config=p/owasp-top-ten \
                  --json \
                  --output semgrep-ts-report.json \
                  apps/api/src/ packages/shared/src/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-typescript-reports
          path: semgrep-ts-report.json

  sca:
    name: Dependency Scan (pip-audit + npm audit)
    runs-on: ubuntu-latest
    needs: [sast-python, sast-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: pip install pip-audit
      - name: Python dependency audit
        run: |
          pip-audit -r apps/agent/requirements.txt \
                    -r apps/swarm-worker/requirements.txt \
                    --format json \
                    --output pip-audit-report.json || true
      - name: Node dependency audit
        run: npm audit --audit-level=high --json > npm-audit-report.json
      - name: Block on unresolved Python vulnerabilities with fixes
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("pip-audit-report.json")
          if not report.exists():
              print("PASS: pip-audit report was not produced")
              sys.exit(0)
          data = json.loads(report.read_text())
          dependencies = data if isinstance(data, list) else data.get("dependencies", [])
          findings = []
          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  if vuln.get("fix_versions"):
                      findings.append((dep.get("name"), vuln.get("id")))
          if findings:
              print(f"FAIL: {len(findings)} Python vulnerabilities with fixes found: {findings[:10]}")
              sys.exit(1)
          print("PASS: No unresolved Python vulnerabilities with fixes")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            pip-audit-report.json
            npm-audit-report.json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: sca
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: pip install -r apps/agent/requirements.txt
      - run: pip install -r apps/swarm-worker/requirements.txt
      - name: Run agent tests
        run: |
          python -m pytest apps/agent/tests/ -q \
            --tb=short \
            --junit-xml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image
        run: docker build -t rawclaw-agent:ci -f apps/agent/Dockerfile apps/agent/
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rawclaw-agent:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
